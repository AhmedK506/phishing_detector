<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phishing Detector — Reports & History</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#f1f5f9; color:#1e293b; padding:32px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:24px; display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:24px; }

  .summary { display:flex; gap:12px; margin-bottom:24px; }
  .stat { flex:1; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; text-align:center; }
  .stat .n { font-size:26px; font-weight:700; }
  .stat .l { font-size:12px; color:#64748b; margin-top:2px; }
  .stat.danger .n { color:#dc2626; }
  .stat.safe .n { color:#16a34a; }

  .section-title { font-size:16px; font-weight:600; margin:24px 0 12px; }

  /* History table */
  table { width:100%; background:#fff; border-collapse:collapse; border-radius:10px; overflow:hidden; border:1px solid #e2e8f0; }
  th { background:#f8fafc; text-align:left; padding:10px 14px; font-size:12px; color:#64748b; text-transform:uppercase; letter-spacing:.4px; }
  td { padding:10px 14px; border-top:1px solid #f1f5f9; font-size:13px; }
  .badge { padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.phishing { background:#fee2e2; color:#991b1b; }
  .badge.suspicious { background:#fef9c3; color:#854d0e; }
  .badge.safe { background:#dcfce7; color:#166534; }
  .url-cell { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#475569; }

  /* Formal report card */
  .report { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:24px; margin-bottom:18px; }
  .report-head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #dc2626; padding-bottom:12px; margin-bottom:16px; }
  .report-head .title { font-size:16px; font-weight:700; color:#dc2626; }
  .report-head .id { font-size:12px; color:#94a3b8; font-family:monospace; }
  .field { display:flex; padding:7px 0; font-size:13px; border-bottom:1px solid #f8fafc; }
  .field .k { width:150px; color:#64748b; font-weight:500; }
  .field .v { flex:1; word-break:break-all; }
  .sev { font-weight:700; }
  .sev.High, .sev.Critical { color:#dc2626; }
  .sev.Medium { color:#d97706; }
  .comps { display:flex; gap:10px; margin:14px 0; }
  .comp { flex:1; background:#f8fafc; border-radius:8px; padding:10px; text-align:center; }
  .comp .cn { font-size:18px; font-weight:700; }
  .comp .cl { font-size:11px; color:#64748b; }
  .indicators { margin-top:12px; }
  .indicators .ih { font-size:13px; font-weight:600; margin-bottom:6px; }
  .ind { font-size:12px; color:#475569; padding:5px 0 5px 18px; position:relative; }
  .ind::before { content:"⚠"; position:absolute; left:0; color:#dc2626; }
  .rec { margin-top:14px; background:#fef2f2; border-left:3px solid #dc2626; padding:10px 12px; font-size:12px; color:#7f1d1d; border-radius:0 6px 6px 0; }

  .empty { text-align:center; color:#94a3b8; padding:40px; }
  .clear-btn { float:right; background:#fff; border:1px solid #e2e8f0; padding:7px 14px; border-radius:8px; font-size:12px; cursor:pointer; color:#64748b; }
  .clear-btn:hover { background:#fee2e2; color:#dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ Phishing Detector — Reports & History</h1>
  <div class="sub">Scan history and detailed threat reports</div>

  <div class="summary" id="summary"></div>

  <div class="section-title">Scan History <button class="clear-btn" id="clear">Clear All</button></div>
  <div id="history"></div>

  <div class="section-title">Threat Reports</div>
  <div id="reports"></div>
</div>

<script src="report.js"></script>
</body>
</html>
